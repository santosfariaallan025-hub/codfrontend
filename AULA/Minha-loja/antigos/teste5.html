<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
</head>
<body>

     <h1>Loja Virtual</h1>

    <section class="products">

        <article class="product-card">
            <img src="/img/Black_and_white_Playstation_5_base_edition_with_controller.png"
                 alt="Playstation 5"
                 width="300"
                 height="300">
            <h2>Playstation 5</h2>
            <p>R$ 3.704,05</p>
        </article>

        <article class="product-card">
            <img src="./img/Xbox Series X 1TB-2.png"
                 alt="Xbox Series"
                 width="300"
                 height="300">
            <h2>Xbox Series X 1TB</h2>
            <p>R$ 3.641,32</p>
        </article>

        <article class="product-card">
            <img src="./img/nintendo-switch-2-system-and-accessories-gallery_hd3f.png"
                 alt="Nitendo Switch"
                 width="300"
                 height="300">
            <h2>Nitendo Switch 2</h2>
            <p>R$ 3.263,24</p>
        </article>

    </section>

    <section class="promo-video">
        <h2>Vídeo Promocional da Playstation</h2>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/1BU4VXofbQk?si=O1tvlC91RmH1BwbQ" title="YouTube video player"
            title="Vídeo promocional"
            allowfullscreen>
        </iframe>
    </section>

        <h2>Vídeo Promocional da Nintendo</h2>
        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/itpcsQQvgAQ?si=jKQwGJVbmrOicaN0" title="YouTube video player"
            title="Vídeo promocional"
            allowfullscreen>
        </iframe>
    </section>
        <h2>Vídeo Promocional da Xbox</h2>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/mzDPNi77F24?si=b5pVUPbZ3FeAuHXD" title="YouTube video player"
            title="Vídeo promocional"
            allowfullscreen>
        </iframe>
    </section>

    <section class="store-location">
        <h2>Nossa Loja</h2>

        <iframe
            src="https://www.google.com/maps?q=Avenida+Paulista,+1000,+São+Paulo&output=embed"
            width="600"
            height="450"
            style="border:0;"
            loading="lazy">
        </iframe>
    </section>

</body>
</html>
