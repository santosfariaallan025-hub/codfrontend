<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Catálogo de Filmes</title>
    <link rel="stylesheet" href="/css/styleNew.css">
</head>
<body>

    <header>
        <h1>Meu Catálogo de Filmes</h1>
    </header>

    <main>
        <section id="cadastro">
            <h2>Cadastrar Novo Filme</h2>
            <form id="form-cadastro">
                <input type="text" id="nome-item" placeholder="Nome do Jogos" required>
                <input type="url" id="url-imagem" placeholder="URL da Imagem do Jogo" required>
                <button type="submit">Adicionar ao Catálogo</button>
            </form>
        </section>

        <section id="catalogo">
            <h2>Meus Filmes Favoritos</h2>
            <div id="lista-itens">

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Atividade de Revisão</p>
    </footer>

    <script src="/novo_js/script3.js"></script>
</body>
</html>
