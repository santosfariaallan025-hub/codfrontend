<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    
<h2>contato e Cadastro</h2>

<form>

    Nome:<br>
    <input type="text" required minlength="3"><br><br>

    E-mail:<br>
    <input type="email" required><br><br>

    Senha:<br>
    <input type="password" required minlength="8"><br><br>

    Idade:<br>
    <input type="number" min="18" max="120"><br><br>

    Categoria:<br>
    <select>
        <option>Eletrônicos</option>
        <option>Roupas</option>
        <option>Games</option>
    </select><br><br>

    Preferências:<br>
    <input type="checkbox"> Newsletter
    <input type="checkbox"> Ofertas
    <br><br>

    Mensagem:<br>
    <textarea rows="4" cols="30"></textarea>
    <br><br>

    <input type="submit" value="Enviar">
</form>

</body>
</html>
